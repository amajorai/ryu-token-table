[package]
name = "ryu-token-table"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Authoritative local six-max no-limit Texas Hold'em sidecar with SQLite persistence and simulated-token accounting."
publish = false

[[bin]]
name = "ryu-token-table"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
ryu-sidecar-runtime = { path = "../crates/core/sidecar-runtime", version = "0.4.0" }
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

